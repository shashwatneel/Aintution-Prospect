kind = "web"
previewPath = "/"
title = "Aintution Prospects"
version = "1.0.0"
id = "artifacts/aintution-prospects"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21931

[services.development]
run = "pnpm --filter @workspace/aintution-prospects run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aintution-prospects", "run", "build" ]
publicDir = "artifacts/aintution-prospects/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21931"
BASE_PATH = "/"
